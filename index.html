<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essential Cinema | Jensen Stars</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --surface-color: #1a1a1d;
            --text-main: #f0f0f0;
            --text-muted: #a0a0a5;
            --accent-color: #d4af37;
            --tmdb-blue: #01b4e4;
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; }
        header { text-align: center; padding: 4rem 1rem; background: linear-gradient(to bottom, #1a1a1d, #0f0f11); }
        h1 { color: var(--accent-color); text-transform: uppercase; letter-spacing: 2px; margin: 0; }
        
        main { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .region-section { margin-bottom: 4rem; }
        .region-title { font-size: 1.8rem; border-bottom: 2px solid var(--accent-color); padding-bottom: 5px; margin-bottom: 2rem; display: inline-block; }
        
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        
        .movie-card { background: var(--surface-color); border-radius: 12px; padding: 1.2rem; border: 1px solid #2a2a30; transition: 0.3s; display: flex; flex-direction: column; }
        .movie-card:hover { transform: translateY(-5px); border-color: var(--accent-color); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }

        /* Shorter Poster Ratio (135% instead of 150%) */
        .poster { position: relative; width: 100%; padding-top: 135%; border-radius: 8px; overflow: hidden; margin-bottom: 1rem; }
        .poster img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

        .title { font-size: 1.3rem; margin: 0; color: #fff; }
        .meta { font-size: 0.85rem; color: var(--accent-color); margin: 5px 0; }

        /* Ratings Row */
        .ratings { display: flex; gap: 12px; margin: 10px 0; align-items: center; }
        .rating-item { display: flex; align-items: center; font-size: 0.8rem; font-weight: bold; }
        .rating-item.tmdb { color: var(--tmdb-blue); }
        .rating-item svg { width: 16px; margin-right: 4px; }
        .placeholder-rating { color: #555; font-style: italic; font-size: 0.75rem; }

        .desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; flex-grow: 1; margin-bottom: 1.5rem; }
        .cn-title { color: #fff; font-weight: bold; }

        .watch-btn { 
            text-align: center; padding: 10px; border: 1px solid var(--accent-color); 
            color: var(--accent-color); text-decoration: none; border-radius: 6px; 
            font-weight: bold; font-size: 0.8rem; transition: 0.3s;
        }
        .watch-btn:hover { background: var(--accent-color); color: #000; }
    </style>
</head>
<body>

    <header>
        <h1>Essential Cinema</h1>
        <p style="color: var(--text-muted)">Curated by Jensen Stars</p>
    </header>

    <main id="movie-content">
        <!-- Content will be injected here by JavaScript -->
    </main>

    <script>
        async function loadMovies() {
            const response = await fetch('data/movies.json');
            const movies = await response.json();
            
            // Sort movies by region
            const grouped = movies.reduce((acc, m) => {
                acc[m.region] = acc[m.region] || [];
                acc[m.region].push(m);
                return acc;
            }, {});

            const container = document.getElementById('movie-content');
            
            for (const region in grouped) {
                const section = document.createElement('section');
                section.className = 'region-section';
                section.innerHTML = `<h2 class="region-title">${region}</h2><div class="movie-grid"></div>`;
                const grid = section.querySelector('.movie-grid');

                grouped[region].forEach(m => {
                    grid.innerHTML += `
                        <div class="movie-card">
                            <div class="poster"><img src="${m.poster}" alt="${m.title}"></div>
                            <h3 class="title">${m.title}</h3>
                            <div class="meta">${m.year} • Dir: ${m.director}</div>
                            
                            <div class="ratings">
                                <div class="rating-item tmdb">
                                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279-7.416-3.967-7.417 3.967 1.481-8.279-6.064-5.828 8.332-1.151z"/></svg>
                                    ${m.rating}
                                </div>
                                <span class="placeholder-rating">IMDb --</span>
                                <span class="placeholder-rating">LB --</span>
                            </div>

                            <p class="desc"><span class="cn-title">${m.original_title}:</span> ${m.desc}</p>
                            <a href="${m.watch_link}" target="_blank" class="watch-btn">WATCH NOW</a>
                        </div>
                    `;
                });
                container.appendChild(section);
            }
        }
        loadMovies();
    </script>
</body>
</html>
