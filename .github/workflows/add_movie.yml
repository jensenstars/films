name: Add Movie to List

on:
  issues:
    types: [opened]

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write # This gives the bot permission to save the file
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install Dependencies
        run: pip install requests
        
      - name: Run Update Script
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python scripts/update_list.py
        
      - name: Commit and Push changes
        run: |
          git config --global user.name "Movie-Bot"
          git config --global user.email "bot@github.com"
          git add data/movies.json
          
          # This line checks if there are actual changes before committing.
          # If no changes are detected (e.g., movie not found), it skips the commit gracefully.
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated: Add movie from issue #${{ github.event.issue.number }}" && git push)
