name: Add Movie to List
on:
  issues:
    types: [opened]

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the bot to commit the updated JSON
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install Dependencies
        run: pip install requests
        
      - name: Run Update Script
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python scripts/update_list.py
        
      - name: Commit and Push changes
        run: |
          git config --global user.name "Movie-Bot"
          git config --global user.email "bot@github.com"
          git add data/movies.json
          git commit -m "Automated: Add movie from issue #${{ github.event.issue.number }}"
          git push
